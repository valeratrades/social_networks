cargo-features = ["codegen-backend"]

[package]
name = "social_networks_reach"
version = "0.3.18"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "the transcript format of the on-demand axis, and the CLI that fills it"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/social_networks"
include = ["src/**/*", "build.rs", "README.md"]

# only the bin crate tags releases
[package.metadata.release]
tag = false

[[bin]]
name = "recon"
# not `src/bin/`: the repo ignores `**/bin/`, and a source file that never reaches git is worse
path = "src/recon.rs"

[dependencies]
clap.workspace = true
color-eyre.workspace = true
colored.workspace = true
futures.workspace = true
grammers-client.workspace = true
jiff.workspace = true
libsql.workspace = true
serde.workspace = true
serde_json.workspace = true
social_networks_adapters.workspace = true
social_networks_utils.workspace = true
strum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
v_utils.workspace = true
xdg.workspace = true

[lints]
workspace = true
