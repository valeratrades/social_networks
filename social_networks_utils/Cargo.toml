cargo-features = ["codegen-backend"]

[package]
name = "social_networks_utils"
version = "0.4.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "shared primitives for social_networks"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/social_networks"

# only the bin crate tags releases
[package.metadata.release]
tag = false

[package.metadata.cargo-machete]
ignored = ["glass_pumpkin"]

[dependencies]
color-eyre.workspace = true
exchange_interactions.workspace = true
futures.workspace = true
glass_pumpkin.workspace = true # grammers-crypto 0.10.0 breaks on 2.0.0-rc1
grammers-client.workspace = true
grammers-mtsender.workspace = true
grammers-session.workspace = true
image.workspace = true
jiff.workspace = true
libsql.workspace = true
psm.workspace = true
ravif.workspace = true
tracing.workspace = true
xdg.workspace = true

[lints]
workspace = true
