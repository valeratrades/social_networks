env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUSTC_WRAPPER: ''
  RUSTUP_MAX_RETRIES: '10'
  RUST_BACKTRACE: short
jobs:
  load_nix:
    runs-on: ubuntu-latest
    steps:
    - name: Lean cache setup
      run: 'mkdir -p /tmp/nix-lean-cache

        chmod 0777 /tmp/nix-lean-cache

        printf ''#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix
        copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true"
        $OUT_PATHS || true\n'' > /tmp/nix-lean-pbh.sh

        chmod 0755 /tmp/nix-lean-pbh.sh

        '
      shell: bash
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: 'lazy-trees = true

          post-build-hook = /tmp/nix-lean-pbh.sh

          extra-substituters = file:///tmp/nix-lean-cache

          extra-trusted-substituters = file:///tmp/nix-lean-cache

          require-sigs = false

          '
    - name: Lean nix cache (built-only paths)
      uses: actions/cache@v5
      with:
        key: nix-lean-${{ runner.os }}-${{ github.run_id }}
        path: /tmp/nix-lean-cache
        restore-keys: nix-lean-${{ runner.os }}-
    - name: Cache packages
      run: '# Pre-fetch packages into nix store so they''re cached for dependent jobs

        # Use nix-shell which properly sets up env vars like PKG_CONFIG_PATH

        nix-shell -p mold pkg-config openssl.out openssl.dev git --run "echo packages
        cached"

        '
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  rust-tests:
    if: needs.pre_ci.outputs.continue
    name: Rust ${{matrix.rust}}
    needs:
    - load_nix
    - pre_ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Lean cache setup
      run: 'mkdir -p /tmp/nix-lean-cache

        chmod 0777 /tmp/nix-lean-cache

        printf ''#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix
        copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true"
        $OUT_PATHS || true\n'' > /tmp/nix-lean-pbh.sh

        chmod 0755 /tmp/nix-lean-pbh.sh

        '
      shell: bash
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: 'lazy-trees = true

          post-build-hook = /tmp/nix-lean-pbh.sh

          extra-substituters = file:///tmp/nix-lean-cache

          extra-trusted-substituters = file:///tmp/nix-lean-cache

          require-sigs = false

          '
    - name: Lean nix cache (built-only paths)
      uses: actions/cache@v5
      with:
        key: nix-lean-${{ runner.os }}-${{ github.run_id }}
        path: /tmp/nix-lean-cache
        restore-keys: nix-lean-${{ runner.os }}-
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{matrix.rust}}
    - name: Install mold
      uses: rui314/setup-mold@v1
    - if: github.ref == 'refs/heads/release'
      name: Set RUSTFLAGS for release branch
      run: echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV
    - if: matrix.rust == 'nightly'
      name: Enable type layout randomization
      run: 'nix-shell -p mold pkg-config openssl.out openssl.dev git --command "export
        LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && printf ''#!/bin/sh\\nexec \"\$@\" -Zrandomize-layout --cfg=exhaustive\\n''
        > /tmp/randomize-layout.sh

        chmod +x /tmp/randomize-layout.sh

        echo RUSTC_WORKSPACE_WRAPPER=/tmp/randomize-layout.sh >> \$GITHUB_ENV

        "'
    - name: Download modified by pre-ci Cargo.toml files
      uses: actions/download-artifact@v7
      with:
        name: modified-cargo-files
    - run: nix-shell -p mold pkg-config openssl.out openssl.dev git --command "export
        LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && cargo update"
    - run: nix-shell -p mold pkg-config openssl.out openssl.dev git --command "export
        LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && cargo check"
    - run: nix-shell -p mold pkg-config openssl.out openssl.dev git --command "export
        LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && cargo test"
    strategy:
      fail-fast: false
      matrix:
        rust:
        - nightly
        - nightly-2026-06-29
    timeout-minutes: 45
name: Errors
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
