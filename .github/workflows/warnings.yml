          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org file:///tmp/nix-lean-cache
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - id: lean-restore
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-particle-rust-clippy-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
          restore-keys: |-
            nix-lean-particle-rust-clippy-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-lean-particle-rust-clippy-${{ runner.os }}-
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: particle-cache-0
        name: Restore particle's cache
        uses: actions/cache/restore@v5
        with:
          key: particles-warnings-rust-clippy-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('./Cargo.lock') }}
          path: |-
            ./target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          restore-keys: particles-warnings-rust-clippy-0-${{ runner.os }}-
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Stamp particle's cache
        run: '[ ! -d ./target ] || find ./target -type f -exec touch -a -d @1 {} +'
        shell: bash
      - id: run
        run: nix run .#test -- --severity warnings rust-clippy
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Sweep particle's cache
