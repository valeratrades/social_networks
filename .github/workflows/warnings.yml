        uses: actions/cache/save@v5
        with:
          key: nix-lean-particle-rust-clippy-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
      - env:
          FAMILY: nix-lean-particle-rust-clippy-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.lean-restore.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
